<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source de la vignette OpenGraph (1200 × 630). `index.html` sert le PNG : Discord, LinkedIn et X
  ne lisent pas le SVG. Liberation Sans a les métriques d'Helvetica ; sans elle, le curseur
  chevauche le « b ».

      docker run --rm -i alpine:3.20 sh -c 'apk add -q rsvg-convert font-liberation \
        font-jetbrains-mono && rsvg-convert -w 1200 -h 630 -f png' \
        < public/og-card.svg > public/og-card.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="halo-prune" cx="0.08" cy="-0.14" r="0.9">
      <stop offset="0%" stop-color="#A4477E" stop-opacity="0.34" />
      <stop offset="62%" stop-color="#A4477E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo-profond" cx="1.08" cy="1.12" r="0.8">
      <stop offset="0%" stop-color="#6B2853" stop-opacity="0.42" />
      <stop offset="58%" stop-color="#6B2853" stop-opacity="0" />
    </radialGradient>
    <pattern id="trame" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C9A227" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <linearGradient id="estompe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <mask id="masque-trame">
      <rect width="1200" height="630" fill="url(#estompe)" />
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#0A060C" />
  <rect width="1200" height="630" fill="url(#halo-prune)" />
  <rect width="1200" height="630" fill="url(#halo-profond)" />
  <rect width="1200" height="630" fill="url(#trame)" mask="url(#masque-trame)" />

  <rect x="80" y="150" width="40" height="5" fill="#C9A227" />
  <text x="136" y="160" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="24"
    fill="#C9A227" letter-spacing="7">SERVEURS · DISCORD · LEAGUE OF LEGENDS</text>

  <text x="80" y="300" font-family="Helvetica, Arial, sans-serif" font-size="112" font-weight="bold"
    fill="#F2E9EE" letter-spacing="-3">Schub</text>
  <rect x="420" y="248" width="22" height="52" fill="#C9A227" />

  <text x="80" y="386" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#B6A3B4">
    La boîte à outils de la communauté Miam :
  </text>
  <text x="80" y="438" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#B6A3B4">
    serveurs de jeu et équipes League of Legends.
  </text>

  <rect x="80" y="516" width="1040" height="1" fill="#C9A227" fill-opacity="0.22" />
  <text x="80" y="566" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="28"
    fill="#C9A227">schultz-thomas.fr</text>
</svg>
