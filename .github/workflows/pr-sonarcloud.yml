name: pr - sonarcloud analysis

on:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  analysis:
    name: pr - sonarcloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # premadelab-player.html reçoit son <title> par SSI (nginx, depuis le BFF) : Sonar ne peut pas le voir.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.projectKey=thomas-jacque-schultz_Front
            -Dsonar.organization=thomas-jacque-schultz
            -Dsonar.coverage.exclusions=**/*
            -Dsonar.issue.ignore.multicriteria=ssi
            -Dsonar.issue.ignore.multicriteria.ssi.ruleKey=Web:PageWithoutTitleCheck
            -Dsonar.issue.ignore.multicriteria.ssi.resourceKey=premadelab-player.html
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
