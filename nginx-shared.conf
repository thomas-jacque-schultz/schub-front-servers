# Commun aux deux sites : les fichiers du build et le relais /api vers le BFF.

# Les fichiers du build portent leur empreinte dans leur nom : ils ne changent jamais, et un fichier
# absent est une vraie absence. Rendre l'index à sa place faisait échouer le chargement d'un écran
# dans un onglet ouvert avant un déploiement — page blanche jusqu'au rafraîchissement.
location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /api/ {
    proxy_pass http://${BFF_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    # Le BFF reconnaît le front à cet hôte, contre sa liste : URL de retour Discord et page d'arrivée.
    proxy_set_header X-Forwarded-Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Derrière le tunnel, l'IP réelle du visiteur est dans CF-Connecting-IP : le BFF en limite le débit du contact.
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
}
