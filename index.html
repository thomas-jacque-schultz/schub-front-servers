<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Ces balises sont celles de la RACINE, et c'est volontaire.

      Un SPA Vite ne produit qu'un seul `index.html`, servi tel quel pour toutes les routes.
      `useDocumentMeta` affine ensuite le titre et la description écran par écran — ce que Google
      lit, parce qu'il exécute le JavaScript. La plupart des aperçus de partage (Discord, Slack,
      LinkedIn) ne l'exécutent pas : ils ne verront JAMAIS que ce fichier. D'où la règle tenue
      ici — ce qui est écrit ci-dessous doit être juste pour `/`, la page la plus partagée.

      Depuis les retours d'usage, `/` est la page produit de Schub et le contenu personnel vit
      sur `/contact`. Ces balises ont suivi : un lien partagé annonçait un CV, il annonce
      maintenant ce que le site fait.
    -->
    <title>Schub — la boîte à outils de la communauté Miam</title>
    <meta
      name="description"
      content="Schub rassemble les outils de la communauté Discord Miam : des serveurs de jeu démarrés à la demande depuis le site ou Discord, et de quoi faire vivre une équipe League of Legends — statistiques, pool de champions, préparation de draft."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Thomas Schultz" />
    <link rel="canonical" href="https://schultz-thomas.fr/" />

    <!-- Les `hreflang` de la racine. Les autres routes les posent dynamiquement (LocalizedRoot),
         mais celles-ci doivent exister sans JavaScript : c'est la page d'entrée du domaine. -->
    <link rel="alternate" hreflang="fr" href="https://schultz-thomas.fr/" />
    <link rel="alternate" hreflang="en" href="https://schultz-thomas.fr/en" />
    <link rel="alternate" hreflang="x-default" href="https://schultz-thomas.fr/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Schub" />
    <meta property="og:title" content="Schub — la boîte à outils de la communauté Miam" />
    <meta
      property="og:description"
      content="La boîte à outils de la communauté Miam : serveurs de jeu à la demande et équipes League of Legends."
    />
    <meta property="og:url" content="https://schultz-thomas.fr/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <!-- Produit depuis public/og-card.svg. Le regénérer si la source change. -->
    <meta property="og:image" content="https://schultz-thomas.fr/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Schub — la boîte à outils de la communauté Miam" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://schultz-thomas.fr/og-card.png" />
    <meta name="twitter:title" content="Schub — la boîte à outils de la communauté Miam" />
    <meta
      name="twitter:description"
      content="La boîte à outils de la communauté Miam."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#0A060C" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Ce site a besoin de JavaScript pour s'afficher. Le code et les documents d'architecture
      restent lisibles sur GitHub&nbsp;: https://github.com/thomas-jacque-schultz
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
