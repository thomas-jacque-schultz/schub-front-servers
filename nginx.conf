# Pages publiques prérendues au build (scripts/prerender.mjs), lisibles sans JavaScript.
map $uri $premadelab_prerendu {
    default "";
    ~^/$ /prerendu/fr/index.html;
    ~^/en/?$ /prerendu/en/index.html;
    ~^/(presentation|contact|terms|privacy)/?$ /prerendu/fr/$1.html;
    ~^/en/(presentation|contact|terms|privacy)/?$ /prerendu/en/$1.html;
}

# PremadeLab : reconnu à son nom de domaine. Le tunnel transmet l'hôte public tel quel.
server {
    listen 80;
    server_name premadelab.eu www.premadelab.eu dev.premadelab.eu;

    if ($host = www.premadelab.eu) {
        return 301 https://premadelab.eu$request_uri;
    }

    include /etc/nginx/conf.d/shared.inc;

    location = /robots.txt {
        alias /usr/share/nginx/html/premadelab/robots.txt;
    }

    # Preuve de propriété du domaine demandée par le portail développeur de Riot.
    location = /riot.txt {
        alias /usr/share/nginx/html/premadelab/riot.txt;
        default_type text/plain;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/premadelab/favicon.svg;
        default_type image/svg+xml;
    }

    # Les profils publics, lisibles sans JavaScript : nginx insère par SSI le head (titre, Open Graph)
    # et un contenu que React remplace à son montage. Le BFF produit les deux.
    location ~ ^(?<player_lang>/en)?/players/(?<player_slug>[^/]+)/?$ {
        root /usr/share/nginx/html;
        ssi on;
        try_files /premadelab-player.html =404;
        add_header Cache-Control "no-cache";
    }

    # Les pages publiques d'équipe (Schub#98) : même mécanique que les profils. Une équipe privée reçoit un
    # head en noindex, et React affiche la 404 ou, à un membre connecté, la page complète.
    location ~ "^(?<team_lang>/en)?/teams/(?<team_id>[0-9a-f]{24})/?$" {
        root /usr/share/nginx/html;
        ssi on;
        try_files /premadelab-team.html =404;
        add_header Cache-Control "no-cache";
    }

    # Les combos par palier (Schub#112) : même mécanique, le classement du jour en HTML pour les robots.
    location ~ "^(?<combo_lang>/en)?/combos/(?<combo_tier>[a-z-]+)/(?<combo_kind>[a-z-]+)/?$" {
        root /usr/share/nginx/html;
        ssi on;
        try_files /premadelab-combos.html =404;
        add_header Cache-Control "no-cache";
    }

    # Le plan du site liste les profils relevés : il change avec la collecte, le BFF le produit.
    location = /sitemap.xml {
        proxy_pass http://${BFF_UPSTREAM}/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Les routes de src/premadelab/routes.tsx : à tenir à jour avec elles.
    location ~ ^(/en)?(/|/(presentation|stats|teams|teams/[^/]+|combos|queue-killer|queue-killer/scribble|queue-killer/scribble/[A-Z]{4}|profile|login|contact|terms|privacy)/?)?$ {
        root /usr/share/nginx/html;
        try_files $premadelab_prerendu /premadelab.html;
        add_header Cache-Control "no-cache";
    }

    # Le reste : un fichier du build, sinon une vraie 404 (l'application s'affiche quand même).
    location / {
        root /usr/share/nginx/html;
        try_files $uri =404;
        error_page 404 /premadelab.html;
    }

    location = /premadelab.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}

# Schub : tout autre hôte, dont l'accès direct sur le réseau local.
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/conf.d/shared.inc;

    # Le Storybook, public et lié en pied de page. Son try_files retombe sur SON index : sans ça,
    # une URL profonde du Storybook rendrait l'application.
    location /storybook/ {
        alias /usr/share/nginx/html/storybook/;
        try_files $uri $uri/ /storybook/index.html;
    }

    location = /storybook {
        return 301 /storybook/;
    }

    # Un robots.txt qui renvoie du HTML est traité comme absent.
    location = /robots.txt {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # L'index n'est jamais gardé en cache : c'est lui qui désigne les fichiers de la version en ligne.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
