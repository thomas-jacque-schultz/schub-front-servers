server {
    listen 80;
    server_name _;

    # Le Storybook, servi en statique sous /storybook — public, et lié en pied de page.
    #
    # Il est DÉCLARÉ AVANT la règle « / » : nginx choisit le préfixe le plus long, donc l'ordre
    # ne compte pas ici, mais le lecteur, lui, doit voir tout de suite que ce chemin ne passe pas
    # par l'application React.
    #
    # Le `try_files` retombe sur l'index DU STORYBOOK, pas sur celui de l'application : sans
    # cette précision, une URL profonde du Storybook rendrait le portfolio, ce qui est le genre
    # de bizarrerie qu'on met une heure à comprendre.
    location /storybook/ {
        alias /usr/share/nginx/html/storybook/;
        try_files $uri $uri/ /storybook/index.html;
    }

    # Sans la barre finale, l'alias ne s'applique pas : on redirige plutôt que de servir un 404.
    location = /storybook {
        return 301 /storybook/;
    }

    # Les fichiers que les moteurs de recherche vont chercher à la racine, et eux seuls.
    # Ils doivent répondre du texte, jamais l'index.html de l'application — un robots.txt qui
    # renvoie du HTML est traité comme absent.
    location = /robots.txt {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Les fichiers du build portent leur empreinte dans leur nom : ils ne changent jamais, et un fichier
    # absent est une vraie absence. Rendre l'index à sa place faisait échouer le chargement d'un écran
    # dans un onglet ouvert avant un déploiement — page blanche jusqu'au rafraîchissement.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # L'application : toute route inconnue rend l'index, c'est le routeur React qui tranche. L'index
    # n'est jamais gardé en cache : c'est lui qui désigne les fichiers de la version en ligne.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://schub-bff:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La route publique de contact est limitée en débit par le BFF, qui a besoin de l'IP
        # réelle du visiteur pour le faire. Derrière le tunnel Cloudflare, c'est
        # CF-Connecting-IP qui la porte ; `X-Forwarded-For` ci-dessus la relaie déjà, mais on
        # transmet explicitement l'en-tête Cloudflare pour que le BFF n'ait pas à deviner.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
